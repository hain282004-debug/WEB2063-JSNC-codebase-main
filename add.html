<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add - WEB2064</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <nav class="bg-blue-600 text-white shadow">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <strong>WEB2064 JSNC</strong>

        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="hover:text-gray-200">Danh sách</a>
          <a href="add.html" class="hover:text-gray-200">Thêm mới</a>
        </div>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 px-4 text-center">
      <h1 class="text-2xl font-semibold mb-6">Thêm phim mới</h1>

      <form id="form-add" class="space-y-6">
        <div>
          <label for="title" class="block font-medium mb-1">Tên phim</label>
          <input
            id="title"
            type="text"
            name="title"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="director" class="block font-medium mb-1">Đạo diễn</label>
          <input
            id="director"
            type="text"
            name="director"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="year" class="block font-medium mb-1">Năm phát hành</label>
          <input
            id="year"
            type="number"
            name="year"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="genre" class="block font-medium mb-1">Thể loại</label>
          <select
            id="genre"
            name="genre"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">-- Chọn thể loại --</option>
            <option value="Action">Action</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Horror">Horror</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
          </select>
        </div>

        <div>
          <label for="duration" class="block font-medium mb-1">
            Thời lượng (phút)
          </label>
          <input
            id="duration"
            type="number"
            name="duration"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <p id="error" class="text-red-500"></p>
        <p id="message" class="text-green-600"></p>
        <p id="loading" class="text-blue-600 hidden">Loading...</p>

        <div class="flex justify-center gap-3">
          <button
            type="submit"
            class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
          >
            Thêm phim
          </button>

          <a
            href="index.html"
            class="px-5 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition"
          >
            Quay lại
          </a>
        </div>
      </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <script src="add.js"></script>
  </body>
</html>
